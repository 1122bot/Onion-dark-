<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing - Onion Dark</title>
<link rel="stylesheet" href="/css/style.css?v=20261021-onion-dark">
</head>
<body>
<div class="pricing-shell">
    <div class="pricing-wrap">
        <header class="pricing-header">
            <div class="pricing-hero glass">
                <div class="pricing-hero-badge" id="pricing-badge">Premium access</div>
                <div class="pricing-hero-body">
                    <div class="brand pricing-brand">
                        <span class="icon" id="brand-icon"></span>
                        <h1 id="brand-title" class="brand-wordmark brand-wordmark-pricing">ONION DARK</h1>
                    </div>
                    <div class="pricing-hero-copy">
                        <h2>Private network. Complete control.</h2>
                        <p id="brand-subtitle">Secure WhatsApp management, built for focused operations.</p>
                    </div>
                </div>
                <div class="pricing-hero-meta">
                    <span>Fast setup</span>
                    <span>Priority support</span>
                    <span>Owner-managed</span>
                </div>
            </div>
        </header>

        <div id="pricing-root" class="pricing-grid"></div>

        <div class="pricing-footer">
            <p>Need help? Contact owner or channel below.</p>
            <div class="pricing-owner" id="pricing-owner" hidden><img id="owner-photo" alt="Owner profile"><strong id="owner-name"></strong></div>
            <p><a href="/index.html">Login</a> · <a id="channel-link" href="#" target="_blank" rel="noopener">Telegram Channel</a> · <a id="owner-link" href="#" target="_blank" rel="noopener">Owner Contact</a></p>
        </div>
    </div>
</div>

<script src="/js/icons.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js?v=20261021-onion-dark"></script>
<script>
    async function renderPricing() {
        const brand = await loadBranding() || window.__BRAND__ || {};
        const brandTitle = document.getElementById("brand-title");
        const brandSubtitle = document.getElementById("brand-subtitle");
        const brandIcon = document.getElementById("brand-icon");
        const paymentRoot = document.getElementById("pricing-root");
        document.title = `${brand.webName || "Panel"} Pricing`;
        const channelLink = document.getElementById("channel-link");
        const ownerLink = document.getElementById("owner-link");
        channelLink.href = brand.telegramChannel || "#";
        ownerLink.href = brand.telegramOwnerContact || "#";
        channelLink.hidden = !brand.telegramChannel;
        ownerLink.hidden = !brand.telegramOwnerContact;

        if (brand.webName) brandTitle.textContent = brand.webName;
        if (brand.webSubtitle) brandSubtitle.textContent = brand.webSubtitle;
        if (brand.pricingBadge) document.getElementById("pricing-badge").textContent = brand.pricingBadge;
        const owner = document.getElementById("pricing-owner");
        if (brand.ownerName || brand.ownerPhoto) {
            owner.hidden = false;
            document.getElementById("owner-name").textContent = brand.ownerName || "Owner";
            if (brand.ownerPhoto) document.getElementById("owner-photo").src = brand.ownerPhoto;
        }
        if (brand.logoPhoto) {
            brandIcon.innerHTML = `<img class="brand-photo splash-photo" src="${brand.logoPhoto}" alt="${brand.webName || 'Onion Dark'} logo">`;
        }

        let pricing = { plans: {} };
        try {
            const data = await api('/system/pricing');
            pricing = data.pricing || pricing;
        } catch (error) {
            console.warn('Failed to load pricing', error);
        }

        const planGroups = Object.entries(pricing.plans || {}).map(([key, plans]) => ({
            key,
            title: key === 'LIFETIME' ? 'Lifetime Access' : key,
            note: 'One-time payment',
            plans,
        }));

        const cards = planGroups.map(({ key, title, note, plans: sourcePlans }) => {
            const plans = Array.isArray(sourcePlans) ? sourcePlans : [];
            const rows = plans.length ? `<li><span>Access</span><strong>Permanent</strong></li><li><span>Payment</span><strong>One time</strong></li>` : `<li><span>Custom</span><strong>Contact owner</strong></li>`;
            const orderUrl = brand.telegramOwnerContact || brand.telegramChannel || "";
            const label = orderUrl ? `Order ${title}` : 'Owner contact unavailable';
            return `
                <article class="card pricing-card ${key === 'LIFETIME' ? 'featured' : ''}">
                    <span class="tag">${key}</span>
                    <h2>${title}</h2>
                    <div class="price"><strong>${plans[0] ? `$${Number(plans[0].price).toLocaleString('en-US')}` : 'Custom'}</strong><span>${note}</span></div>
                    <ul>${rows}</ul>
                    <button class="btn cta" type="button" data-order-link="${orderUrl}" data-order-label="${label}" ${orderUrl ? '' : 'disabled'}>${label}</button>
                </article>
            `;
        }).join('');

        paymentRoot.innerHTML = cards;
        paymentRoot.querySelectorAll('[data-order-link]').forEach((button) => {
            button.addEventListener('click', () => {
                const href = button.dataset.orderLink;
                if (href && /^https?:\/\//.test(href)) {
                    window.open(href, '_blank', 'noopener');
                    return;
                }
                if (href && href.startsWith('tg:')) {
                    window.location.href = href;
                    return;
                }
                window.location.href = '/index.html';
            });
        });

    }

    renderPricing();
</script>
</body>
</html>
